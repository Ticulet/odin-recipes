<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Basic Calculator App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="section">
      <div class="calculator-container">
        <input type="text" readonly id="display" />
        <div class="calculator-buttons-container">
          <button class="calc-num-btn">1</button>
          <button class="calc-num-btn">2</button>
          <button class="calc-num-btn">3</button>
          <button class="calc-op-btn">+</button>
          <button class="calc-num-btn">4</button>
          <button class="calc-num-btn">5</button>
          <button class="calc-num-btn">6</button>
          <button class="calc-op-btn">-</button>
          <button class="calc-num-btn">7</button>
          <button class="calc-num-btn">8</button>
          <button class="calc-num-btn">9</button>
          <button class="calc-op-btn">*</button>
          <button class="calc-num-btn">.</button>
          <button class="calc-num-btn">0</button>
          <button class="calc-equals-btn">=</button>
          <button class="calc-op-btn">/</button>
          <button class="calc-clear-btn">C</button>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
